# ─────────────────────────────────────────────
# 🐋 Polymarket Whale Tracker — Config
# ─────────────────────────────────────────────

# Minimum trade size in USD to trigger an alert
min_trade_size: 500

# How often to check for new trades (seconds)
check_interval: 30

telegram:
  # Get a bot token from @BotFather on Telegram
  bot_token: "YOUR_BOT_TOKEN"
  # Your chat ID (use @userinfobot to find it)
  chat_id: "YOUR_CHAT_ID"

polymarket:
  api_url: "https://clob.polymarket.com"

filters:
  # Filter whale alerts to specific market categories.
  # Categories are matched against Polymarket market tags (case-insensitive).
  # Common categories: politics, crypto, sports, science, business, entertainment
  # Leave empty or omit the filters section to receive alerts for all categories.
  categories: []
  #   - politics
  #   - crypto
